<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <rect width="680" height="470" fill="#16181d"/>

  <text x="20" y="30" fill="#e8e8ea" font-size="16" font-weight="600">ThinkBook ForcePad 模组内连接关系（本机实测 + 推断）</text>
  <text x="20" y="50" fill="#8b8f98" font-size="11">实线 = ✅ 已确认 · 虚线 = ⚠️ 半确认/推断 · 红叉 = ❌ 无证据</text>

  <!-- 主机 -->
  <rect x="20" y="72" width="120" height="62" rx="8" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="80" y="98" fill="#cfe4f7" font-size="13" font-weight="600" text-anchor="middle">Windows 主机</text>
  <text x="80" y="116" fill="#8fb8dd" font-size="10" text-anchor="middle">hidi2c.sys（独占）</text>
  <text x="80" y="129" fill="#8fb8dd" font-size="10" text-anchor="middle">PCI 8086:7E78</text>

  <!-- I2C0 总线 -->
  <rect x="170" y="80" width="76" height="46" rx="6" fill="#2a2d35" stroke="#5a6070" stroke-width="1.2"/>
  <text x="208" y="100" fill="#d0d4dc" font-size="11" font-weight="600" text-anchor="middle">I²C0</text>
  <text x="208" y="116" fill="#9aa0ac" font-size="9.5" text-anchor="middle">400 kHz</text>

  <line x1="140" y1="103" x2="170" y2="103" stroke="#4a90d9" stroke-width="2"/>
  <text x="155" y="96" fill="#7fb3e8" font-size="9" text-anchor="middle">0x2C</text>

  <line x1="246" y1="103" x2="292" y2="103" stroke="#4a90d9" stroke-width="2"/>

  <!-- GT7868Q -->
  <rect x="292" y="66" width="164" height="76" rx="8" fill="#1f3d33" stroke="#3f9e7c" stroke-width="1.5"/>
  <text x="374" y="88" fill="#bfe8d8" font-size="13" font-weight="600" text-anchor="middle">GT7868Q / GXTP5100</text>
  <text x="374" y="105" fill="#8fcbb4" font-size="10" text-anchor="middle">汇顶触控主控 · 核=8051(Turbo51)</text>
  <text x="374" y="119" fill="#8fcbb4" font-size="10" text-anchor="middle">HID 主机接口 · 4 个集合</text>
  <text x="374" y="132" fill="#6fae97" font-size="9.5" text-anchor="middle">代码在 mask ROM（读不到）</text>

  <!-- GT7868Q -> TF100A -->
  <line x1="374" y1="142" x2="374" y2="196" stroke="#e0a850" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="382" y="172" fill="#e0a850" font-size="10">片内 I²C1</text>
  <text x="382" y="184" fill="#b08a44" font-size="9">从机 0x2C（⚠️ 未证）</text>

  <!-- TF100A -->
  <rect x="292" y="196" width="164" height="76" rx="8" fill="#3d3320" stroke="#c9973f" stroke-width="1.5"/>
  <text x="374" y="218" fill="#f0dcb4" font-size="13" font-weight="600" text-anchor="middle">TF100A</text>
  <text x="374" y="235" fill="#c9ab74" font-size="10" text-anchor="middle">钛方压力 MCU · Cortex-M3</text>
  <text x="374" y="249" fill="#c9ab74" font-size="10" text-anchor="middle">判据 |Δ压力| &gt; 40  ⟵ 可改</text>
  <text x="374" y="263" fill="#a08a5c" font-size="9.5" text-anchor="middle">✅ 已反汇编（唯一）</text>

  <!-- PA3 doorbell -->
  <path d="M292 234 L246 234 L246 300 L292 300" fill="none" stroke="#c9973f" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="256" y="248" fill="#c9973f" font-size="9.5">PA3</text>
  <text x="256" y="259" fill="#a08a5c" font-size="8.5">门铃</text>
  <text x="252" y="290" fill="#a08a5c" font-size="9">A2 回复帧</text>

  <!-- GT7868Q -> AW86927 : NO EVIDENCE -->
  <line x1="456" y1="103" x2="520" y2="103" stroke="#d9534f" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="500" y="95" fill="#d9534f" font-size="16" font-weight="700" text-anchor="middle">✕</text>
  <text x="490" y="124" fill="#c0706d" font-size="9">❌ 四项全无</text>

  <!-- AW86927 -->
  <rect x="520" y="66" width="140" height="76" rx="8" fill="#3a2430" stroke="#b0567a" stroke-width="1.5"/>
  <text x="590" y="88" fill="#f0c8d8" font-size="13" font-weight="600" text-anchor="middle">AW86927FCR</text>
  <text x="590" y="105" fill="#c48fa6" font-size="10" text-anchor="middle">艾为触觉驱动 · 丝印 CA4F</text>
  <text x="590" y="119" fill="#c48fa6" font-size="10" text-anchor="middle">I²C 0x5A / 0x5B</text>
  <text x="590" y="133" fill="#a8768c" font-size="9.5" text-anchor="middle">8 KB SRAM 波形库（掉电失）</text>

  <!-- AW86927 -> LRA -->
  <line x1="590" y1="142" x2="590" y2="200" stroke="#4a90d9" stroke-width="2"/>
  <text x="600" y="176" fill="#7fb3e8" font-size="10">HDP/HDN</text>
  <text x="600" y="188" fill="#5f8fb8" font-size="9">pin 7 / pin 5</text>

  <!-- LRA -->
  <rect x="520" y="200" width="140" height="60" rx="8" fill="#2a2d35" stroke="#6a7080" stroke-width="1.5"/>
  <text x="590" y="222" fill="#d0d4dc" font-size="13" font-weight="600" text-anchor="middle">LRA 线性马达</text>
  <text x="590" y="239" fill="#9aa0ac" font-size="10" text-anchor="middle">FRU 5T60S94326</text>
  <text x="590" y="252" fill="#7d838f" font-size="9">⚠️ 型号未直接确认</text>

  <!-- Legend / notes -->
  <rect x="20" y="290" width="440" height="164" rx="8" fill="#1b1e24" stroke="#333844"/>
  <text x="34" y="312" fill="#c8ccd4" font-size="12" font-weight="600">关键事实</text>
  <text x="34" y="332" fill="#9aa0ac" font-size="10">• 主机 ↔ GT7868Q：✅ 已确认（I²C0 @ 0x2C，400 kHz，Col04 可读写）</text>
  <text x="34" y="349" fill="#9aa0ac" font-size="10">• GT7868Q ↔ TF100A：⚠️ 半确认（走 I²C1 还是 USART1 未证；PA3 对端未证）</text>
  <text x="34" y="366" fill="#9aa0ac" font-size="10">• TF100A 不驱动马达：✅ 四条否定证据（CR1.START 全镜像 0 次等）</text>
  <text x="34" y="383" fill="#9aa0ac" font-size="10">• GT7868Q → AW86927：❌ 无证据（淘汰法推断，是唯一候选）</text>
  <text x="34" y="400" fill="#9aa0ac" font-size="10">• 主机侧无触觉触发面：✅ Col02 的 OutputReportByteLength = 0</text>
  <text x="34" y="417" fill="#9aa0ac" font-size="10">• ★ 高频读 Col04 会抑制【所有】震动反馈（按下 + 抬起）</text>
  <text x="34" y="434" fill="#c9973f" font-size="10">  ⇒ 震动触发在「固件↔主机 I²C 通信」层，不在内存数据层</text>
  <text x="34" y="449" fill="#7d838f" font-size="9.5">  这是唯一证明「主机能影响震动路径」的现象（方向为抑制）</text>

  <!-- 唯一可行路径 -->
  <rect x="476" y="286" width="184" height="86" rx="8" fill="#1f3d33" stroke="#3f9e7c" stroke-width="1.5"/>
  <text x="568" y="308" fill="#bfe8d8" font-size="12" font-weight="600" text-anchor="middle">★ 唯一可行的路</text>
  <text x="568" y="328" fill="#8fcbb4" font-size="10" text-anchor="middle">改 TF100A 判据立即数</text>
  <text x="568" y="345" fill="#8fcbb4" font-size="10" text-anchor="middle">40 → 8（仅 2 字节）</text>
  <text x="568" y="363" fill="#6fae97" font-size="9.5" text-anchor="middle">file 0x1A54C / 0x1A578</text>
</svg>
